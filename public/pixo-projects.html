<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ff;--ink:#1a1033;--mut:#6e6590;--v:#6f4bff;--lil:#d8ccfa;--card:#fff;--ln:rgba(26,16,51,.12);--art:#d8ccfa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110b22;--ink:#f0eaff;--mut:#a89ec8;--lil:#2e2260;--card:#1b1334;--ln:rgba(240,234,255,.15)}}
:root[data-theme="dark"]{--bg:#110b22;--ink:#f0eaff;--mut:#a89ec8;--lil:#2e2260;--card:#1b1334;--ln:rgba(240,234,255,.15)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
:focus-visible{outline:3px solid var(--v);outline-offset:3px}
#aur{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(closest-side,rgba(111,75,255,.26),transparent);pointer-events:none;z-index:0;filter:blur(20px)}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:50;margin-top:10px;display:flex;align-items:center;gap:20px;padding:8px 8px 8px 18px;border-radius:99px;background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(14px);border:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:8px;font:700 20px Unbounded,Manrope,sans-serif;letter-spacing:-.04em;margin-right:auto;color:var(--ink);text-decoration:none}
.nav a.lk{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;padding:6px 4px;position:relative}
.lk::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:2px;background:var(--v);transform:scaleX(0);transition:transform .35s}
.lk:hover::after,.lk.on::after{transform:scaleX(1)}
.bd{margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--lil);font-size:12px}
.sv{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:#3bbf7a;flex:none}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;font:700 15px Manrope,sans-serif;padding:14px 22px;border-radius:99px;background:var(--v);color:#fff;box-shadow:0 12px 28px -12px var(--v);transition:box-shadow .3s,translate .3s}
.btn:hover{box-shadow:0 18px 34px -10px var(--v)}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--ln);box-shadow:none}
.btn i{font-style:normal;transition:translate .3s}.btn:hover i{translate:4px 0}
.nav .btn{padding:11px 18px}
.hero{padding-top:clamp(36px,6vw,80px)}
h1{font:700 clamp(2rem,5.4vw,4.9rem)/1.04 Unbounded,Manrope,sans-serif;letter-spacing:-.045em;margin:0 0 clamp(24px,3vw,40px)}
h1>span{display:block}
.w{display:inline-block;overflow:hidden;padding:.1em .05em;margin:-.1em -.05em;vertical-align:top}
.l{display:inline-block}
.ol .l{color:transparent;-webkit-text-stroke:1.6px var(--ink)}
.js .l{animation:up .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*28ms)}
@keyframes up{from{transform:translateY(105%) rotate(7deg)}}
.hg{display:grid;grid-template-columns:4fr 8fr;gap:clamp(24px,4vw,56px);align-items:center}
.hp{color:var(--mut);font-size:1.08rem;max-width:34ch;margin:0 0 24px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.ws{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:28px;box-shadow:0 40px 80px -40px rgba(80,40,200,.55);transform:perspective(1400px) rotateY(-5deg) rotateX(3deg);transition:transform .8s cubic-bezier(.2,.8,.2,1);overflow:hidden;cursor:pointer}
.ws:hover{transform:none}
.js .ws{animation:rise 1s .5s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0;translate:0 70px}}
.wb{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ln);font-size:13px;color:var(--mut)}
.wb b{color:var(--ink);font:600 14px Unbounded,Manrope,sans-serif;letter-spacing:-.02em}
.wb span:last-child{margin-left:auto}
.cv2{position:relative;container-type:size;overflow:hidden;height:clamp(210px,20vw,270px);background-color:var(--art);background-image:radial-gradient(rgba(26,16,51,.2) 1.3px,transparent 1.6px);background-size:18px 18px;transition:background-color .5s}
.ws .cv2{height:clamp(240px,27vw,350px)}
.cv2::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.6),transparent 65%);opacity:0;transition:opacity .3s;pointer-events:none;mix-blend-mode:soft-light}
[data-px]:hover .cv2::after{opacity:1}
.o{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--w)*1cqh);aspect-ratio:1;rotate:calc(var(--r,0)*1deg);translate:calc(var(--px,0)*var(--z,1)*18px) calc(var(--py,0)*var(--z,1)*18px);transition:translate .5s cubic-bezier(.2,.8,.2,1),scale .5s cubic-bezier(.3,1.4,.4,1);filter:drop-shadow(5px 7px 0 rgba(26,16,51,.2));overflow:visible}
.pc .o{transform-origin:center}
@keyframes mobile-preview-float{50%{transform:translateY(-4px) rotate(1deg)}}
.scene-preview{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
[data-px]:hover .o{scale:1.07}
.cu{--c:var(--v);position:absolute;z-index:4;pointer-events:none;animation:wd 12s ease-in-out infinite alternate}
.cu.b{--c:#e23d79;animation-duration:15s;animation-direction:alternate-reverse}
.cu svg{display:block;width:22px;height:22px;fill:var(--c);stroke:#fff;stroke-width:1.5;filter:drop-shadow(2px 3px 0 rgba(26,16,51,.25))}
.cu b{position:absolute;left:16px;top:18px;padding:3px 10px;border-radius:0 10px 10px 10px;background:var(--c);color:#fff;font:700 11px Manrope,sans-serif;white-space:nowrap}
@keyframes wd{0%{left:10%;top:18%}25%{left:46%;top:58%}50%{left:72%;top:22%}75%{left:28%;top:68%}100%{left:82%;top:58%}}
.tb{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin:clamp(48px,7vw,96px) 0 24px}
.fl{display:flex;gap:8px;flex-wrap:wrap}
.fp{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 16px;border-radius:99px;border:1.5px solid var(--ln);background:var(--card);color:var(--ink);font:700 14px Manrope,sans-serif;cursor:pointer;transition:background .3s,color .3s,translate .25s}
.fp:hover{translate:0 -3px}
.fp i{font-style:normal;padding:1px 9px;border-radius:99px;background:var(--lil);font-size:12px;color:var(--ink)}
.fp.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.fp.on i{background:var(--v);color:#fff}
.inp{width:min(100%,300px);padding:11px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:500 14px Manrope,sans-serif}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.pc{--tl:28px;--tr:28px;grid-column:span var(--s);position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--ln);border-radius:var(--tl) var(--tr) 28px 28px;transition:border-color .3s,translate .4s cubic-bezier(.2,.8,.2,1)}
.pc:nth-child(4n+2){--tr:90px}.pc:nth-child(4n+4){--tl:90px}
.pc:hover{border-color:var(--v);translate:0 -4px}
.pc:has(.mw.open){z-index:6}
.pc .cv2{border-radius:calc(var(--tl) - 1px) calc(var(--tr) - 1px) 0 0}
.in{animation:pi .6s cubic-bezier(.3,1.3,.4,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes pi{from{opacity:0;scale:.9;translate:0 24px}}
.out{animation:out .26s forwards}@keyframes out{to{opacity:0;scale:.85}}
.tg{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;gap:6px;opacity:0;translate:0 8px;transition:opacity .3s,translate .4s cubic-bezier(.3,1.4,.4,1)}
.pc:hover .tg,.pc:focus-within .tg{opacity:1;translate:0}
.tg span{padding:4px 11px;border-radius:99px;background:var(--card);color:var(--ink);font-size:12px;font-weight:700}
.em{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:700}
.gh{width:68px;opacity:.4;transition:rotate .6s cubic-bezier(.3,1.6,.4,1)}.pc:hover .gh{rotate:-14deg}
.pi{display:flex;align-items:flex-end;gap:12px;padding:18px 20px 20px}
.pi>div:first-child{margin-right:auto;min-width:0}
.pi h3{margin:0 0 4px;font:600 1.05rem/1.25 Unbounded,Manrope,sans-serif;letter-spacing:-.02em}
.open{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.open::after{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit}
.pi p{margin:0;color:var(--mut);font-size:14px}.pi small{color:var(--mut);font-size:12.5px}
.mw{position:relative;z-index:3}
.mn{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:700 16px Manrope,sans-serif;letter-spacing:1px;cursor:pointer;transition:border-color .25s}
.mn:hover{border-color:var(--v)}
.mu{position:absolute;right:0;bottom:calc(100% + 8px);display:none;flex-direction:column;min-width:170px;padding:6px;background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:0 20px 40px -16px rgba(80,40,200,.45)}
.mw.open .mu{display:flex;animation:pm .3s cubic-bezier(.3,1.5,.4,1)}@keyframes pm{from{opacity:0;scale:.8}}
.mu button{text-align:left;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--ink);font:700 13px Manrope,sans-serif;cursor:pointer}
.mu button:hover{background:var(--lil)}
.nw{grid-column:span var(--s);position:relative;overflow:hidden;min-height:340px;border:0;border-radius:44px 44px 44px 160px;background:var(--v);color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:left;cursor:pointer;font:inherit;transition:translate .4s cubic-bezier(.2,.8,.2,1)}
.nw:hover{translate:0 -4px}
.pls{position:absolute;left:28px;top:28px;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--v);display:grid;place-items:center;font:600 34px Unbounded,sans-serif;transition:rotate .6s cubic-bezier(.3,1.4,.4,1)}
.nw:hover .pls{rotate:180deg}
.nw b{position:relative;font:600 1.5rem/1.1 Unbounded,Manrope,sans-serif;letter-spacing:-.03em}
.nw small{position:relative;font-size:14px;opacity:.8}
.fo{position:absolute;aspect-ratio:1;translate:calc(var(--px,0)*var(--d)*-1px) calc(var(--py,0)*var(--d)*-1px);transition:translate .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(8px 10px 0 rgba(26,16,51,.28))}
.nf{grid-column:1/-1;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:32px;border:1.5px dashed var(--ln);border-radius:28px;color:var(--mut)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:64px 48px;color:var(--mut);font-size:14px}
#cur{position:fixed;left:0;top:0;z-index:60;pointer-events:none}
#cur i{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--v);opacity:0;transition:opacity .3s}
#cur.on i{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 160%;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:99px;font-weight:700;transition:translate .5s cubic-bezier(.3,1.4,.4,1);z-index:70;max-width:calc(100vw - 32px);text-align:center}
.toast.on{translate:-50% 0}
@media(hover:none){#cur,#aur{display:none}}
@media(hover:none) and (prefers-reduced-motion:no-preference){.pc .o{animation:mobile-preview-float 4.5s ease-in-out infinite;animation-delay:calc(var(--z,1)*.15s)}.pc .o:nth-child(even){animation-delay:.7s}}
@media(max-width:900px){.hg{grid-template-columns:1fr}.ws{transform:none}.nav .lk,.nav .sv{display:none}.pc,.nw{grid-column:1/-1!important}.pc{--tr:28px!important;--tl:28px!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

}
return(p.o||[]).map(([k,x,y,w,r,z])=>'<svg class="o" style="--x:'+x+';--y:'+y+';--w:'+w+';--r:'+r+';--z:'+z+'" viewBox="0 0 100 100"><use href="#'+k+'"/></svg>').join('')
};
function card(p,i,all){
const n=itemCount(p),tg=Array.isArray(p.items)?[...new Set(itemsOf(p).map(o=>o.name))].slice(0,3):[...new Set((p.o||[]).map(o=>NM[o[0]]))].slice(0,3),W=p.format?.width||1200,H=p.format?.height||800;
return '<article class="pc'+(all||p.fresh?' in':'')+'" data-id="'+esc(String(p.id))+'" data-px style="--s:'+SP[(i+1)%SP.length]+';--art:'+(p.pal||p.backgroundColor||PAL[0])+';--i:'+i+'"><div class="cv2">'+
(n?sc(p)+'<div class="tg">'+tg.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>':'<div class="em"><svg class="gh" viewBox="0 0 100 100"><use href="#puzzle"/></svg>Пока нет объектов</div>')+
'</div><div class="pi"><div><h3><button class="open">'+esc(p.name||p.t||'Без названия')+'</button></h3><p>'+pl(n)+', '+W+' × '+H+'</p><small>Изменён '+esc(p.d||'сейчас')+'</small></div><div class="mw"><button class="mn" aria-label="Меню проекта">···</button><div class="mu"><button data-a="rename">Переименовать</button><button data-a="dup">Дублировать</button><button data-a="del">Удалить</button></div></div></div></article>'}
function feat(){const p=P.find(p=>itemCount(p))||P[0];if(!p)return;$('#ws').style.setProperty('--art',p.pal||p.backgroundColor||PAL[0]);$('#fs').innerHTML=sc(p);$('#ft').textContent=p.name||p.t;const n=itemCount(p);$('#fm').textContent=pl(n)+', изменён '+(p.d||'сейчас')}
function render(all){
const full=P.filter(p=>itemCount(p)).length;
$$('.fp').forEach(b=>{const k=b.dataset.f;b.classList.toggle('on',k===f);b.querySelector('i').textContent=k==='all'?P.length:k==='full'?full:P.length-full});
const v=P.filter(p=>(f==='all'||(f==='full')===!!itemCount(p))&&(p.name||p.t||'').toLowerCase().includes(q));
g.innerHTML='<button class="nw" data-new data-px style="--s:4"><span class="pls">+</span><svg class="fo" style="right:8%;top:8%;width:34%;--d:24" viewBox="0 0 100 100"><use href="#puzzle"/></svg><svg class="fo" style="right:36%;top:30%;width:28%;--d:44" viewBox="0 0 100 100"><use href="#book"/></svg><b>Новый проект</b><small>Чистый холст 1200 × 800</small></button>'+
v.map((p,i)=>card(p,i,all)).join('')+
(v.length?'':'<div class="nf"><b>'+(q?'Ничего не нашлось':'Проектов пока нет')+'</b>'+(q&&qr?'<button class="btn" data-new data-name="'+esc(qr)+'">Создать «'+esc(qr)+'» <i>+</i></button>':q?'Попробуйте изменить запрос.':'Создайте первый проект — он сохранится на этом устройстве.')+'</div>');
P.forEach(p=>p.fresh=0);feat()}const ts=$('.toast');let tt;
function toast(m){ts.textContent=m;ts.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>ts.classList.remove('on'),2800)}
const closeM=()=>$$('.mw.open').forEach(w=>{w.classList.remove('open');const d=w.querySelector('[data-a=del]');d.dataset.sure='';d.textContent='Удалить'});
const notifyParent=(type,payload={})=>{if(window.parent&&window.parent!==window){window.parent.postMessage({type,...payload},window.location.origin);return true}return false};
window.addEventListener('message',e=>{
if(e.origin!==window.location.origin||!e.data)return;
if(e.data.type==='pixo:theme'){document.documentElement.dataset.theme=e.data.theme;return}
if(e.data.type!=='pixo:projects-data'||!Array.isArray(e.data.projects))return;
hasParentData=true;
P=e.data.projects.map(project=>({
id:String(project.id),name:String(project.name||'Без названия'),updatedAt:project.updatedAt,
d:project.updatedAt?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(new Date(project.updatedAt)):'сейчас',
format:project.format||{width:1200,height:800},backgroundColor:project.backgroundColor||PAL[0],pal:project.transparent?'#d8ccfa':project.backgroundColor||PAL[0],items:Array.isArray(project.items)?project.items:[]
}));
render(true)
});
document.addEventListener('click',e=>{
const px=e.target.closest('[data-pixo]');if(px){e.preventDefault();if(notifyParent('pixo:open-'+px.dataset.pixo))return}
const t=e.target,tz=t.closest('[data-toast]');
if(tz){e.preventDefault();return toast(tz.dataset.toast)}
if(!t.closest('.mw'))closeM();
const m=t.closest('.mn');
if(m){const w=m.parentElement,o=w.classList.contains('open');closeM();w.classList.toggle('open',!o);return}
const a=t.closest('[data-a]');
if(a){const c=a.closest('.pc'),id=c.dataset.id,i=P.findIndex(p=>String(p.id)===id),p=P[i];if(!p)return;
if(hasParentData&&a.dataset.a==='rename'){notifyParent('pixo:rename-project',{projectId:id});return}
if(hasParentData&&a.dataset.a==='dup'){notifyParent('pixo:duplicate-project',{projectId:id});return}
if(a.dataset.a==='dup'){P.splice(i,0,{...p,o:p.o.map(x=>x.slice()),id:uid++,t:p.t+' (копия)',d:'26 окт.',fresh:1});render();toast('Копия создана');return}
if(!a.dataset.sure){a.dataset.sure=1;a.textContent='Точно удалить?';return}
if(hasParentData){notifyParent('pixo:delete-project',{projectId:id});return}
c.classList.add('out');setTimeout(()=>{P.splice(P.findIndex(x=>x.id===id),1);render();toast('Проект удалён')},260);return}
const nw=t.closest('[data-new]');
if(nw){if(notifyParent('pixo:create-project'))return;const nm=nw.dataset.name||'Без названия'+(++cnt>1?' '+cnt:'');f='all';q='';qr='';$('#q').value='';P.unshift({id:uid++,t:nm,pal:PAL[uid%4],d:'26 окт.',o:[],fresh:1});render();toast('Проект создан: '+nm);return}
const fp=t.closest('.fp');if(fp){f=fp.dataset.f;render(true);return}
const op=t.closest('.open');if(op){const projectId=op.closest('.pc')?.dataset.id;if(projectId){if(!notifyParent('pixo:open-project',{projectId}))toast('Демо: «'+op.textContent+'» откроется в редакторе')}else if(!notifyParent('pixo:open-editor'))toast('Демо: «'+op.textContent+'» откроется в редакторе');return}
if(t.closest('#go,#ws')){if(!notifyParent('pixo:open-editor'))toast('Демо: «'+$('#ft').textContent+'» откроется в редакторе')}});window.addEventListener('message',e=>{if(e.origin===window.location.origin&&e.data&&e.data.type==='pixo:theme'){document.documentElement.dataset.theme=e.data.theme}});
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#q').oninput=e=>{qr=e.target.value.trim();q=qr.toLowerCase();render(false)};
/* заголовок: буквы выезжают по одной */
let n=0;const h=$('h1');h.setAttribute('aria-label',h.textContent);
$$('h1>span').forEach(s=>{s.innerHTML=s.textContent.trim().split(' ').map(w=>'<span class="w" aria-hidden="true">'+[...w].map(c=>'<span class="l" style="--i:'+(n++)+'">'+c+'</span>').join('')+'</span>').join(' ')});
/* параллакс объектов, подсветка и магнитные кнопки */
document.addEventListener('pointermove',e=>{if(rm)return;
const c=e.target.closest('[data-px]');
if(c){const r=c.getBoundingClientRect();c.style.setProperty('--px',((e.clientX-r.left)/r.width*2-1).toFixed(3));c.style.setProperty('--py',((e.clientY-r.top)/r.height*2-1).toFixed(3));c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}
const b=e.target.closest('.btn');if(b){const r=b.getBoundingClientRect();b.style.translate=(e.clientX-r.left-r.width/2)*.2+'px '+(e.clientY-r.top-r.height/2)*.3+'px'}},{passive:true});
document.addEventListener('pointerout',e=>{const c=e.target.closest('[data-px]');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--px',0);c.style.setProperty('--py',0)}const b=e.target.closest('.btn');if(b&&!b.contains(e.relatedTarget))b.style.translate=''});
/* курсор и аврора */
const cur=$('#cur'),aur=$('#aur');let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,ax=mx,ay=my;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;cur.classList.add('on')});
document.addEventListener('pointerleave',()=>cur.classList.remove('on'));
if(!rm&&matchMedia('(hover:hover) and (pointer:fine)').matches)(function f(){cx+=(mx-cx)*.22;cy+=(my-cy)*.22;ax+=(mx-ax)*.06;ay+=(my-ay)*.06;cur.style.transform='translate('+cx+'px,'+cy+'px)';aur.style.transform='translate('+ax+'px,'+ay+'px)';requestAnimationFrame(f)})();
render(true);notifyParent('pixo:request-projects');
</script>
</body>
</html>
